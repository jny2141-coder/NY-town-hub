<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NY town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2f3a;--sub:#6b7280;--card:#ffffff;--chip:#f1f4f9;--me:#2b2f3a;--mefg:#fff;--line:#e6e9f0;--accent:#e2674d;--ok:#3f9a6a}
body.night{--ink:#f2f4fa;--sub:#a9b1c9;--card:#1f2645;--chip:#2c3560;--me:#f2f4fa;--mefg:#1f2645;--line:#333d6b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Nunito',sans-serif;color:var(--ink);background:#dff1fb}
canvas#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit;border:0;cursor:pointer;background:none}
.hud{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:3}
.ib{height:42px;min-width:42px;padding:0 12px;border-radius:21px;background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Fredoka',sans-serif;font-size:14px}
.ib svg{width:18px;height:18px}
.ib.on{background:var(--accent);color:#fff}
.ib[hidden]{display:none}
#enter{position:fixed;right:18px;bottom:46px;transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s;z-index:3;background:var(--card);border-radius:26px;padding:14px 22px;font-family:'Fredoka',sans-serif;font-size:17px;box-shadow:0 6px 22px rgba(0,0,0,.18);display:flex;align-items:center;gap:10px;white-space:nowrap}
#enter.show{opacity:1;transform:none;pointer-events:auto}
#enter i{width:26px;height:26px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
#enter i svg{width:14px;height:14px;stroke:#fff}
#hint{position:fixed;left:50%;top:68px;transform:translateX(-50%);background:rgba(20,26,50,.55);color:#fff;font-size:13px;padding:8px 14px;border-radius:16px;z-index:2;transition:opacity .8s;white-space:nowrap;pointer-events:none}
#toast{position:fixed;left:50%;top:68px;transform:translate(-50%,-8px);background:rgba(20,26,50,.78);color:#fff;font-size:13px;padding:8px 14px;border-radius:16px;z-index:9;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#joy{position:fixed;left:18px;bottom:26px;width:112px;height:112px;border-radius:50%;background:rgba(255,255,255,.28);border:1.5px solid rgba(255,255,255,.6);z-index:3;touch-action:none}
#joy b{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.2)}
/* build panel */
#bp{position:fixed;left:0;right:0;bottom:0;z-index:4;transform:translateY(105%);transition:.28s;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.16);padding:8px 0 calc(10px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
#bp.show{transform:none}
.tabs{display:flex;gap:4px;padding:0 12px 6px}
.tabs button{flex:1;padding:8px 0;border-radius:12px;font-family:'Fredoka',sans-serif;font-size:14px;color:var(--sub)}
.tabs button.sel{background:var(--chip);color:var(--ink)}
#items{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 8px;scrollbar-width:none}
#items::-webkit-scrollbar{display:none}
.it{flex:none;width:74px;border-radius:14px;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;line-height:1.15;text-align:center}
.it canvas,.it svg{width:58px;height:50px}
.it svg{padding:10px 14px}
.it.sel{background:var(--chip);outline:2px solid var(--accent)}
.tools{display:flex;gap:6px;padding:2px 12px 0;border-top:1px solid var(--line);padding-top:8px}
.tools button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 0;border-radius:12px}
.tools button svg{width:20px;height:20px}
.tools button.sel{background:var(--chip);color:var(--accent)}
.tools button:disabled{opacity:.35}
#cbar{position:fixed;left:50%;bottom:calc(206px + env(safe-area-inset-bottom));transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:.2s;z-index:5;background:var(--card);border-radius:20px;padding:8px;display:flex;gap:6px;box-shadow:0 6px 22px rgba(0,0,0,.18);align-items:center}
#cbar.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#cbar span{font-size:13px;padding:0 6px;color:var(--sub);white-space:nowrap}
#cbar button{white-space:nowrap;padding:10px 14px;border-radius:14px;background:var(--chip);font-family:'Fredoka',sans-serif;font-size:14px}
#cbar button.go{background:var(--accent);color:#fff}
#cbar button.go:disabled{opacity:.4}
/* sheet */
.bg{position:fixed;inset:0;background:rgba(10,14,30,.3);opacity:0;pointer-events:none;transition:opacity .25s;z-index:6}
.bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(560px,100%);height:min(80vh,720px);background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);transition:transform .32s cubic-bezier(.2,.9,.3,1.05);z-index:7;display:flex;flex-direction:column}
.sheet.open{transform:translate(-50%,0)}
.sh-head{padding:16px 18px 10px;display:flex;align-items:flex-start;gap:12px;flex:none}
.sh-title{font-family:'Fredoka',sans-serif;font-size:22px;line-height:1.1;display:flex;align-items:center;gap:6px}
.sh-title input{font:inherit;color:inherit;background:var(--chip);border:0;outline:0;border-radius:10px;padding:2px 8px;width:200px}
.sh-title button{opacity:.5;width:28px;height:28px;display:grid;place-items:center}
.sh-title button svg{width:16px;height:16px}
.sh-sub{font-size:13px;color:var(--sub);margin-top:3px}
.dot{width:12px;height:12px;border-radius:50%;margin-top:7px;flex:none}
.x{margin-left:auto;background:var(--chip);width:34px;height:34px;border-radius:50%;font-size:16px;flex:none}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.view[hidden]{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 18px 10px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chips button{background:var(--chip);border-radius:999px;padding:8px 12px;font-size:13px;white-space:nowrap;flex:none}
.toolsline{padding:0 18px 8px;font-size:11.5px;color:var(--sub);flex:none}
#log{flex:1;overflow-y:auto;padding:6px 18px 10px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.m{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-end;background:var(--me);color:var(--mefg);border-bottom-right-radius:5px}
.m.ai{align-self:flex-start;background:var(--chip);border-bottom-left-radius:5px}
.m.pending{color:var(--sub)}
.step{align-self:flex-start;font-size:12px;color:var(--sub);padding-left:4px}
.step.err{color:#d2553f}
.card{align-self:stretch;border:1.5px solid var(--line);border-radius:16px;padding:12px}
.card h4{font-family:'Fredoka',sans-serif;font-weight:500;font-size:15px;margin-bottom:6px}
.card dl{font-size:13px;line-height:1.5;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.card dt{color:var(--sub)}
.card dd{white-space:pre-wrap;word-break:break-word;max-height:120px;overflow:auto}
.card .row{display:flex;gap:8px;margin-top:10px}
.card .row button{flex:1;padding:10px;border-radius:12px;font-family:'Fredoka',sans-serif;font-size:14px;background:var(--chip)}
.card .row button.go{background:var(--accent);color:#fff}
.empty{margin:auto;text-align:center;color:var(--sub);font-size:13.5px;line-height:1.6;padding:10px 20px}
#chatForm{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:none}
#chatForm input{flex:1;min-width:0;border:0;outline:0;background:var(--chip);color:var(--ink);border-radius:20px;padding:11px 15px;font:inherit;font-size:15px}
#sendBtn{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;flex:none;display:grid;place-items:center}
#sendBtn svg{width:18px;height:18px}
/* menu */
#mv{flex:1;overflow-y:auto;padding:4px 18px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.mbar{display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px}
.mbar span{font-size:13px;color:var(--sub)}
.pbtn{background:var(--accent);color:#fff;border-radius:14px;padding:9px 14px;font-family:'Fredoka',sans-serif;font-size:14px}
.pbtn:disabled{opacity:.45}
.sbtn{background:var(--chip);border-radius:14px;padding:9px 14px;font-family:'Fredoka',sans-serif;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dish{text-align:left;border-radius:16px;overflow:hidden;background:var(--chip)}
.dish .ph{aspect-ratio:1;width:100%;object-fit:cover;display:block;background:var(--line)}
.dish b{display:block;font-family:'Fredoka',sans-serif;font-weight:500;font-size:14px;padding:8px 10px 2px}
.dish small{display:block;font-size:11.5px;color:var(--sub);padding:0 10px 9px}
.noph{aspect-ratio:1;display:grid;place-items:center;color:var(--sub);background:var(--line)}
.noph svg{width:34px;height:34px;opacity:.5}
.det img,.det .noph{width:100%;border-radius:16px;aspect-ratio:4/3;object-fit:cover;display:block;margin:6px 0 12px}
.det .noph,.dish .noph{display:grid}
.det h3{font-family:'Fredoka',sans-serif;font-weight:500;font-size:20px}
.det .when{font-size:12px;color:var(--sub);margin:2px 0 10px}
.det h5{font-family:'Fredoka',sans-serif;font-weight:500;font-size:14px;margin:14px 0 6px;color:var(--sub)}
.det ul,.det ol{padding-left:20px;font-size:14.5px;line-height:1.6}
.det p{font-size:14.5px;line-height:1.6;white-space:pre-wrap}
.rowb{display:flex;gap:8px;margin-top:18px}
.rowb button{flex:1}
.back{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--sub);padding:12px 0 4px}
.fm label{display:block;font-size:12.5px;color:var(--sub);margin:12px 0 5px}
.fm input[type=text],.fm textarea{width:100%;border:0;outline:0;background:var(--chip);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:14.5px;resize:vertical}
.fm textarea{min-height:96px;line-height:1.5}
.pick{display:grid;place-items:center;gap:6px;border:2px dashed var(--line);border-radius:16px;aspect-ratio:4/3;color:var(--sub);font-size:13px;overflow:hidden;position:relative}
.pick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pick svg{width:30px;height:30px;opacity:.6}
.note{font-size:12.5px;color:var(--sub);margin-top:8px;line-height:1.5}
.note.err{color:#d2553f}
.stabs{display:flex;gap:6px;padding:12px 0 2px;overflow-x:auto;scrollbar-width:none}
.stabs button,.cats button{flex:none;background:var(--chip);border-radius:999px;padding:8px 13px;font-size:13.5px;white-space:nowrap}
.stabs button.sel,.cats button.sel{background:var(--ink);color:var(--card)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.tt{border:1.5px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:6px}
.tt-h{display:grid;font-size:12px;color:var(--sub);text-align:center;border-bottom:1px solid var(--line);padding:6px 0}
.tt-h .today{color:var(--accent);font-weight:700}
.tt-b{display:grid;position:relative}
.tt-hr{position:relative;border-right:1px solid var(--line)}.tt-hr span{position:absolute;right:4px;font-size:10.5px;color:var(--sub);transform:translateY(2px)}
.tt-c{position:relative;border-right:1px solid var(--line)}.tt-c:last-child{border-right:0}.tt-c.today{background:rgba(226,103,77,.05)}
.tt-c i{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.tt-c em{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:2}
.tt-k{position:absolute;left:1px;right:1px;border-radius:6px;padding:3px 3px;text-align:left;color:#fff;overflow:hidden;display:flex;flex-direction:column;gap:1px}
.tt-k b{font-size:11px;font-weight:700;line-height:1.15;word-break:keep-all}.tt-k small{font-size:9.5px;opacity:.9}
.todo small.due{font-size:11.5px;color:var(--sub);white-space:nowrap}.todo small.due.soon{color:var(--accent);font-weight:700}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.cchips{margin-top:8px;scroll-margin-top:8px}
.crs-top{padding:10px 0 4px 12px;margin-top:8px}.crs-top .when{font-size:13px;color:var(--sub);margin-top:4px}
ul.info{padding-left:18px;margin:8px 0 0;font-size:13.5px;line-height:1.6}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.acts>button{font-size:12.5px;background:var(--ink);color:var(--card);border-radius:10px;padding:7px 10px}.ml-todo button{font-size:12.5px;background:var(--chip);border-radius:10px;padding:7px 10px}.acts a{font-size:12.5px;background:var(--chip);border-radius:10px;padding:7px 10px;text-decoration:none;color:inherit}
.addrow input[type=date]{flex:none;width:122px;font-size:12.5px}
textarea.memo{width:100%;min-height:110px;border:0;outline:0;background:var(--chip);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;line-height:1.5;resize:vertical}
.sch-sec{font-family:'Fredoka',sans-serif;font-size:14px;color:var(--sub);margin:16px 0 8px}
.crs{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.crs-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crs-h b{font-family:'Fredoka',sans-serif;font-weight:500;font-size:16px}
.tag{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--sub)}
.tag.re{background:#fde8e3;color:#b4462f}
.crs ul{padding-left:18px;margin:8px 0 0;font-size:13.5px;line-height:1.6;color:var(--ink)}
.crs .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.crs .acts a,.crs .acts button{font-size:12.5px;background:var(--chip);border-radius:10px;padding:7px 10px;text-decoration:none;color:inherit}
.ml-bar{display:flex;gap:6px;margin:8px 0 6px}.ml-bar input{flex:1;min-width:0;background:var(--chip);border:0;border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;color:inherit}.ml-rf{flex:none;width:40px;border-radius:12px;background:var(--chip);display:grid;place-items:center}.ml-rf svg{width:18px;height:18px}
.ml{display:flex;gap:8px;width:100%;text-align:left;padding:11px 2px;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit}.ml-dot{flex:none;width:7px;height:7px;border-radius:50%;margin-top:7px}.ml.un .ml-dot{background:#3b7be0}.ml-b{flex:1;min-width:0}
.ml-t{display:flex;align-items:baseline;gap:6px;font-size:14px}.ml-t b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}.ml.un .ml-t b,.ml.un .ml-s{font-weight:700}.ml-t small{flex:none;font-size:12px;color:var(--sub)}.ml-n{background:var(--chip);border-radius:8px;padding:0 6px}
.ml-s{font-size:13.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ml-p{font-size:12.5px;color:var(--sub);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4}
.ml-more{width:100%;margin-top:10px;padding:11px;border-radius:12px;background:var(--chip);font-size:13.5px}.ml-err{background:#fbe6e3;color:#9b2d20;border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0}
.ml-top{display:flex;justify-content:space-between;align-items:center;padding:12px 0 4px}.ml-top a{font-size:13px;color:#3b7be0;text-decoration:none}.ml-back{background:var(--chip);border-radius:999px;padding:7px 12px;font-size:13.5px}
.ml-h{font-size:17px;font-weight:700;line-height:1.35;margin:8px 0}.ml-todo{display:inline-flex;gap:6px;align-items:center}.ml-todo select{background:var(--chip);border:0;border-radius:10px;padding:8px;font:inherit;font-size:13px;color:inherit}
.ml-msg{border-top:1px solid var(--line);padding:12px 0}.ml-to{font-size:12px;color:var(--sub);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ml-body{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.6;margin-top:10px}.ml-att{font-size:12.5px;color:var(--sub);margin-top:8px}
.todo{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 0}
.todo input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.todo span{flex:1;word-break:break-word}.todo.done span{text-decoration:line-through;color:var(--sub)}
.todo button{opacity:.45;font-size:15px;padding:0 4px}
.addrow{display:flex;gap:6px;margin-top:6px}.addrow input{flex:1;min-width:0;border:0;outline:0;background:var(--chip);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;font-size:13.5px}
.addrow button{background:var(--chip);border-radius:10px;padding:0 12px;font-size:13px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:var(--chip);border-radius:14px;padding:10px;text-align:center}
.kpi b{display:block;font-family:'Fredoka',sans-serif;font-weight:500;font-size:20px}
.kpi small{font-size:11.5px;color:var(--sub)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td:first-child{color:var(--sub);white-space:nowrap;padding-right:10px}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calc input{width:100%;border:0;outline:0;background:var(--chip);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:15px}
.calc label{font-size:12px;color:var(--sub);display:block;margin-bottom:4px}
.res{margin-top:10px;background:var(--chip);border-radius:14px;padding:12px;font-size:14px;line-height:1.6}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lnk{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:14px;padding:12px;text-decoration:none;color:inherit;font-size:13.5px;line-height:1.3}
.lnk i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.lnk i svg{width:20px;height:20px}
.lnk small{display:block;font-size:11px;color:var(--sub)}
.chef{margin-top:10px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.chef svg{width:16px;height:16px}
</style>
</head>
<body>
<canvas id="cv" aria-label="Village"></canvas>
<div id="hint">탭해서 걷기 · 드래그로 회전 · 두 손가락으로 확대</div>
<div id="toast"></div>
<div class="hud">
  <button class="ib" id="timeBtn" aria-label="시간대"></button>
  <button class="ib" id="buildBtn" aria-label="건설" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l4 4M3 21l9-9M12.500 4.500l3-1.500 5.500 5.500-1.500 3-3-.5-4-4z"/></svg></button>
</div>
<div id="joy"><b></b></div>
<button id="enter"><span id="enterTxt"></span><i><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></button>
<div id="cbar"><span id="cbTxt"></span><button id="cbRot">회전</button><button id="cbNo">취소</button><button id="cbYes" class="go">짓기</button></div>
<div id="bp">
  <div class="tabs" id="tabs"><button data-tab="land">땅</button><button data-tab="build">건물</button><button data-tab="nature">자연</button><button data-tab="decor">장식</button></div>

  <div class="tools">

function F(p,c,o){o=o||{};let nx=0,ny=0,nz=0,cx=0,cy=0,cz=0;const m=p.length;

function box(x,y,z,w,d,h,c,L){const o={ctr:[x+w/2,y+d/2,z+h/2],layer:L||0};const a=[x,y,z],b=[x+w,y,z],cc=[x+w,y+d,z],dd=[x,y+d,z],e=[x,y,z+h],f=[x+w,y,z+h],g=[x+w,y+d,z+h],hh=[x,y+d,z+h];
